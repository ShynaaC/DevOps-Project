apiVersion: apps/v1
kind: Deployment

metadata:
  name: intraops

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: intraops

  template:
    metadata:
      labels:
        app: intraops

    spec:
      containers:
        - name: intraops
          image: companyintranet:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8081

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10