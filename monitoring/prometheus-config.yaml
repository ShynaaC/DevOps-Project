apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'intraops'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - 'intraops-service:8081'